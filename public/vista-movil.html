<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vista móvil · Black Friday · Valeria Ferrer</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#12060d;color:#efd9bd;font-family:system-ui,-apple-system,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;padding:15px 8px 32px;gap:12px}
    header{text-align:center;font-size:13px;letter-spacing:.06em;line-height:1.5}
    header strong{display:block;font-size:15px;color:#f6d3a5}
    .phone{width:min(390px,100%);height:844px;background:#190811;border:5px solid #46353e;border-radius:28px;overflow:hidden;box-shadow:0 24px 70px #0009}
    iframe{display:block;border:0;width:100%;height:100%;background:#190811}
    .note{font-size:12px;opacity:.75;text-align:center;max-width:390px}
    @media(max-width:450px){body{padding:0;gap:0}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}header,.note{display:none}}
  </style>
</head>
<body>
  <header><strong>Black Friday · Vista móvil real</strong>Simulación de pantalla de 390 px de ancho</header>
  <div class="phone"><iframe src="/" title="Portada móvil Valeria Ferrer" loading="eager"></iframe></div>
  <p class="note">La página interior se representa a ancho móvil. Esta vista es una prueba y no modifica producción.</p>
</body>
</html>
