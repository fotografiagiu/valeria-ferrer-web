<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VF Gestión" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Gestión de fichas Valeria Ferrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Valeria Ferrer · Gestión de fichas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Chrome can fire this before React mounts, and the event cannot be
      // retrieved later, so hold on to it for the install button.
      window.__vfInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__vfInstallPrompt = event;
        window.dispatchEvent(new Event('vf-install-ready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
